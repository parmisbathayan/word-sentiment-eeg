name: TeCo broad classification sweep
on:
  workflow_dispatch:
  push:
    paths: ['scripts/teco_classification_sweep.py','tests/cloud_teco_sweep.py','notebooks/teco_classification_sweep.ipynb','.github/workflows/teco-sweep.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: MPLBACKEND=Agg python tests/cloud_teco_sweep.py
