name: TeCo reader duration and familiar sentiment
on:
  workflow_dispatch:
  push:
    paths: ['scripts/teco_other_targets.py','tests/cloud_teco_other_targets.py','notebooks/teco_other_targets.ipynb','.github/workflows/teco-other-targets.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: MPLBACKEND=Agg python tests/cloud_teco_other_targets.py
