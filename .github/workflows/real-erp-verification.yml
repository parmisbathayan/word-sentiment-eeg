name: Verify old and new ERPs on real source data
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-colab.txt
      - run: python -m pip install -r requirements-colab.txt
      - run: python -u scripts/verify_real_erp_compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-erp-compatibility
          path: real_erp_compatibility.json
          retention-days: 7
