name: Sliding reader map tests
on:
  workflow_dispatch:
  push:
    paths: ['scripts/zuco_sliding_reader_maps.py','tests/cloud_sliding_reader_maps.py','notebooks/zuco_sliding_reader_maps.ipynb','.github/workflows/sliding-reader-maps.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_sliding_reader_maps.py
