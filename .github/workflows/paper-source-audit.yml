name: Public paper reproduction source audit
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<3' 'scipy<2'
      - run: python scripts/paper_source_audit.py --output artifacts/paper_source_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper-source-audit
          path: artifacts/paper_source_audit.json
          retention-days: 7
