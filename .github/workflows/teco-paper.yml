name: TeCo paper adaptation checks
on:
  workflow_dispatch:
  push:
    paths: ['src/word_sentiment_eeg/teco_paper*.py','scripts/teco_paper_stages.py','scripts/render_teco_paper.py','tests/cloud_teco_paper.py','notebooks/teco_paper_*.ipynb','.github/workflows/teco-paper.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_teco_paper.py
      - run: python -m compileall -q src/word_sentiment_eeg/teco_paper.py src/word_sentiment_eeg/teco_paper_stats.py scripts/teco_paper_stages.py scripts/render_teco_paper.py
