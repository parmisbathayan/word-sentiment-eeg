name: Compact resumable paper inference
on:
  workflow_dispatch:
  push:
    paths: ['src/word_sentiment_eeg/paper_small_checkpoints.py','scripts/analyze_paper_small_storage.py','tests/cloud_paper_small_storage.py','tests/cloud_small_storage_handoff.py','.github/workflows/paper-small-storage.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_paper_small_storage.py
      - run: python tests/cloud_small_storage_handoff.py
