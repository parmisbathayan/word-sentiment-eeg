name: Remaining linguistic EEG targets
on:
  workflow_dispatch:
  push:
    paths: ['scripts/linguistic_targets.py','scripts/teco_other_targets.py','tests/cloud_linguistic_targets.py','notebooks/linguistic_targets.ipynb','requirements-linguistic.txt','.github/workflows/linguistic-targets.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-linguistic.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-linguistic.txt
      - run: MPLBACKEND=Agg python tests/cloud_teco_other_targets.py
      - run: MPLBACKEND=Agg python tests/cloud_linguistic_targets.py
      - run: MPLBACKEND=Agg python tests/cloud_linguistic_targets.py --real-nlp
