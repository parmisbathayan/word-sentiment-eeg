name: Word-label overview checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/word_label_overview.py','tests/cloud_word_label_overview.py','notebooks/word_label_overview.ipynb','.github/workflows/word-label-overview.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python tests/cloud_word_label_overview.py
