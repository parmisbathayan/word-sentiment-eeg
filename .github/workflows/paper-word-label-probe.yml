name: Original SST word-label probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original labels without EEG reads
        run: |
          python - <<'PY'
          import sys, tempfile, csv, json
          from pathlib import Path
          from collections import Counter
          sys.path[:0]=['scripts','src']
          from paper_sst_source import acquire_sst
          from word_sentiment_eeg.paper_labels import SST
          with tempfile.TemporaryDirectory() as d:
              path,source=acquire_sst(Path(d));sst=SST(path)
              wanted={'Sweet','Wild','Killed','convincing','improve'}
              with open('annotations/word_labels.csv') as stream:
                  for row in csv.DictReader(stream):
                      if 'SR' not in row['tasks'].split(';') or row['word'] not in wanted or row['lexical_class']==row['contextual_class']:continue
                      joined=sst.join(row['sentence'].split(),allow_dictionary_fallback=True)
                      target=joined['words'][int(row['word_index'])]
                      print('VERIFIED_EXAMPLE',json.dumps(dict(word=row['word'],sentence=row['sentence'],sentence_key=row['sentence_key'],word_index=row['word_index'],lexical=row['lexical_class'],contextual=row['contextual_class'],note=row['annotation_note'],source_status=joined['status'],sst=target),ensure_ascii=False))
          PY
