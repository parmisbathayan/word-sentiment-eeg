name: Paper source alignment diagnostics
on:
  workflow_dispatch:
    inputs:
      scripts_only:
        type: boolean
        default: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/paper_alignment_diagnostics.py ${{ inputs.scripts_only && '--scripts-only' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-alignment-diagnostics
          path: artifacts/paper_alignment_diagnostics.json
          retention-days: 7
