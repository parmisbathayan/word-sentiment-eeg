name: Agent-labelled paper subset
on:
  workflow_dispatch:
  push:
    paths: ['scripts/zuco_agent_paper_subset.py','tests/cloud_agent_paper_subset.py','notebooks/zuco_agent_paper_subset.ipynb','.github/workflows/agent-paper-subset.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_agent_paper_subset.py
