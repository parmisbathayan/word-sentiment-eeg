name: Offline synthetic checks
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-colab.txt
      - run: python -m pip install -r requirements-colab.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/cloud_integration.py
      - run: python tests/cloud_erp.py
      - run: python tests/cloud_teco_erp.py
      - run: python tests/cloud_zuco_followups.py
      - run: python tests/cloud_zuco_covariates.py
      - run: python tests/cloud_zuco_context.py
      - run: python tests/cloud_three_level_labels.py
      - run: python tests/cloud_exclusion_flow.py
      - run: python tests/cloud_input_inventory.py
      - run: python tests/cloud_three_level_erp.py
      - run: python tests/cloud_all_plots.py
        env:
          PLOT_PREVIEW_DIR: artifacts/plot_test_previews
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-plot-previews
          path: artifacts/plot_test_previews/*.png
          retention-days: 1
