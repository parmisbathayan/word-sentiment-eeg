name: Paper classification protocol checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/zuco_paper_classification.py','src/word_sentiment_eeg/paper_protocol_decoding.py','tests/cloud_paper_classification_protocol.py','requirements-paper-classification.txt','notebooks/zuco_paper_classification.ipynb','.github/workflows/paper-classification.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: python tests/cloud_paper_classification_protocol.py

  colab-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - name: Exercise actual notebook bootstrap, including partial-environment recovery
        run: python tests/cloud_paper_notebook_bootstrap.py
