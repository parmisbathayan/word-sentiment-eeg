name: Paper classification protocol checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/zuco_paper_classification.py','src/word_sentiment_eeg/paper_protocol_decoding.py','tests/cloud_paper_classification_protocol.py','notebooks/zuco_paper_classification.ipynb','.github/workflows/paper-classification.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_paper_classification_protocol.py
