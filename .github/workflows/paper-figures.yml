name: ZuCo paper figure workflow checks
on:
  workflow_dispatch:
    inputs:
      native_pilot:
        type: boolean
        default: false
  push:
    paths: ['src/word_sentiment_eeg/paper_figure_stats.py','scripts/prepare_zuco_paper_figures.py','scripts/render_zuco_paper_figures.py','tests/cloud_paper_figures.py','.github/workflows/paper-figures.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_paper_figures.py
      - if: ${{ inputs.native_pilot }}
        run: python scripts/prepare_zuco_paper_figures.py --thesis-root /tmp/unused-thesis --output artifacts/zuco_paper_figure_pilot --subjects ZAB --blocks 1 --prepare-only --tct-permutations 4 --cluster-permutations 4 --cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-figure-checks
          path: |
            artifacts/paper_figure_previews/*.png
            artifacts/zuco_paper_figure_pilot/readers/*/manifest.json
            artifacts/zuco_paper_figure_pilot/readers/*/source_mapping.json
            artifacts/zuco_paper_figure_pilot/readers/*/matching_counts.csv
          retention-days: 7
