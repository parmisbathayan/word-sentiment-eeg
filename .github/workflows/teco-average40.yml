name: TeCo 40 trial averaging checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/teco_average40.py','tests/cloud_teco_average40.py','notebooks/teco_average40.ipynb','.github/workflows/teco-average40.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: python tests/cloud_teco_average40.py
