name: Averaging sweep synthetic checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/zuco_averaging_sweep.py','tests/cloud_averaging_sweep.py','notebooks/zuco_averaging_sweep.ipynb','.github/workflows/averaging-sweep.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_averaging_sweep.py
