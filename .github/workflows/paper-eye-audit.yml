name: Paper eye endpoint source audit
on:
  workflow_dispatch:
    inputs:
      all_readers:
        type: boolean
        default: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - env:
          ALL_READERS: ${{ inputs.all_readers }}
        run: |
          if [ "$ALL_READERS" = "true" ]; then
            python scripts/audit_paper_eye_endpoints.py --all-readers
          else
            python scripts/audit_paper_eye_endpoints.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-reader-eye-endpoint-audit
          path: artifacts/eye_endpoint_audit.json
          retention-days: 7
