name: TeCo ZuCo style spatial experiment
on:
  workflow_dispatch:
  push:
    paths: ['scripts/teco_spatial40.py','scripts/audit_zuco_overlap.py','tests/cloud_teco_spatial40.py','notebooks/teco_spatial40.ipynb','.github/workflows/teco-spatial40.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: python tests/cloud_teco_spatial40.py
