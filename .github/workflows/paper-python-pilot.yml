name: Python paper methods pilot
on:
  workflow_dispatch:
    inputs:
      channels:
        description: Number of channels for engineering check (3 or all 105)
        default: '3'
        type: choice
        options: ['3', '105']
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python tests/cloud_paper_python.py
      # Explicit diagnostic run at one output-grid sample. The report retains
      # the failed stricter 2-ms native target; this is not a replication run.
      - run: python scripts/zuco_paper_pilot.py --channels ${{ inputs.channels }} --engineering-timing-tolerance-ms 8 --output artifacts/zuco_paper_python_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-paper-pilot
          path: artifacts/zuco_paper_python_smoke
          retention-days: 7
