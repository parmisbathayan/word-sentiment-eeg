name: Independent clock recovery audit
on:
  workflow_dispatch:
    inputs:
      native:
        type: boolean
        default: false
        description: Validate public native EEG in temporary cloud storage
      remaining_rejected:
        type: boolean
        default: false
        description: Check other rejected blocks; skip the seven already audited
  push:
    paths: ['src/word_sentiment_eeg/paper_clock_audit.py','scripts/audit_paper_clock_recovery.py','tests/cloud_paper_clock_audit.py','.github/workflows/paper-clock-recovery.yml']
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python tests/cloud_paper_clock_audit.py
      - id: matrix
        env:
          REMAINING: ${{ inputs.remaining_rejected }}
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          if os.environ.get('REMAINING')=='true':
              groups={}
              for b in json.loads(Path('docs/paper_clock_recovery_audit.json').read_text())['blocks']:
                  if b['reader'] not in {'ZAB','ZPH'}:groups.setdefault(b['reader'],[]).append(b['block'])
              groups.setdefault('ZDN',[]).append('6')
              matrix=[dict(subject=s,blocks=' '.join(sorted(b,key=int)),search='') for s,b in sorted(groups.items())]
          else:matrix=[dict(subject='ZAB',blocks='3 5 7',search='--source-search'),dict(subject='ZPH',blocks='1 2 3 7',search='')]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('value='+json.dumps(dict(include=matrix))+'\n')
          PYCODE
  native:
    if: ${{ inputs.native }}
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.synthetic.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: python -m pip install -r requirements-paper.txt
      - run: python -u scripts/audit_paper_clock_recovery.py --subject ${{ matrix.subject }} --blocks ${{ matrix.blocks }} ${{ matrix.search }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-clock-audit-${{ matrix.subject }}
          path: artifacts/clock_recovery_audit/*.json
          retention-days: 7
