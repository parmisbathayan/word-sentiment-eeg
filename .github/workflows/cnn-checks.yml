name: Compact CNN synthetic checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/classify_cnn.py','tests/cloud_cnn.py','.github/workflows/cnn-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tests/cloud_cnn.py
