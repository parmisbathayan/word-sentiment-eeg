name: Experiment review follow-up
on:
  workflow_dispatch:
  push:
    paths: ['scripts/experiment_review_followup.py','scripts/review_controls.py','scripts/review_fixations.py','tests/cloud_experiment_review.py','notebooks/experiment_review_followup.ipynb','.github/workflows/experiment-review.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python tests/cloud_experiment_review.py
      - run: MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python tests/cloud_teco_other_targets.py
