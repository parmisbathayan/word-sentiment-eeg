name: Original ZuCo and SST linguistic audit
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-colab.txt
      - run: python tests/test_paper_labels.py
      - run: python scripts/paper_linguistic_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-linguistic-audit
          path: artifacts/paper_linguistic_audit.json
          retention-days: 7
