name: Cross-dataset RSA and shared VAE checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/cross_dataset_rsa*.py','tests/cloud_cross_dataset_rsa.py','notebooks/cross_dataset_rsa_vae.ipynb','.github/workflows/cross-dataset-rsa.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-paper-classification.txt
      - run: python -m pip install -r requirements-paper-classification.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python tests/cloud_cross_dataset_rsa.py
